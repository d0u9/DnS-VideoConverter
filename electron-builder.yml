appId: com.dns.videoconverter
productName: DnS Video Converter
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'

mac:
  target:
    - target: dir
  category: public.app-category.video
  icon: build/icon.icns

win:
  target:
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
