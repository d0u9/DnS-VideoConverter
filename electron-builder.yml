appId: com.dns.videoconverter
productName: DnS Video Converter
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true

mac:
  target:
    - target: dir
  category: public.app-category.video

win:
  target:
    - target: portable
  artifactName: '${productName}-${version}-portable.${ext}'

portable:
  artifactName: '${productName}-${version}-portable.${ext}'
